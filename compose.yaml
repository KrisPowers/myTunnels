services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    # The panel answers on this computer alone. Every other device, at home or
    # away, reaches myTunnels through a tunnel, so no port opens on the network.
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - data:/data
      # The key that seals secrets in the database, kept apart from it so a
      # copy of the data volume does not carry them.
      - keys:/keys
      # An empty folder on the host's drive, read-only, so Storage shows that
      # drive's free space rather than Docker Desktop's virtual disk's.
      - ./disk:/host:ro
    environment:
      DOCKER_HOST: tcp://docker:2375
      # This computer's own figures for the Dashboard, from `server host`
      # running on it; without it, they are those of the machine Docker runs.
      HOST_URL: http://host.docker.internal:7094
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker

  # The Dashboard and Containers pages' view of Docker. Only the calls the
  # panel makes are allowed, by method and path: listing, inspecting, logs and
  # stats; start, stop, restart, pause, resume and kill; a container's CPU,
  # memory and restart settings; making and removing a
  # container; building an image from a container's repository or pulling
  # the image a container runs; and listing, inspecting and removing images
  # by ID. Exec, volumes and networks are refused, and only the gateway may connect. The
  # gateway never holds the Docker socket itself.
  docker:
    image: wollomatic/socket-proxy:1.14.0@sha256:fead157c4de4092461267092be49c993c2e6dd296a54c89ed04b8c870016b045
    restart: unless-stopped
    # Root only to open the socket; every capability is dropped.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    command:
      - '-listenip=0.0.0.0'
      - '-allowfrom=gateway'
      - '-allowGET=(/v[0-9.]+)?/(_ping|info|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs|stats)|images/json|images/sha256:[a-f0-9]{64}/(json|history))'
      - '-allowPOST=(/v[0-9.]+)?/(build|images/create|containers/create|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(start|stop|restart|pause|unpause|kill|update))'
      - '-allowDELETE=(/v[0-9.]+)?/(containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*|images/sha256:[a-f0-9]{64})'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  data:
  keys:
