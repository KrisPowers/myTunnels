services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "7070:7070"
    volumes:
      - data:/data
    environment:
      DOCKER_HOST: tcp://docker:2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker

  # The Dashboard and Containers pages' view of Docker: the API with only
  # containers and the engine's info allowed. Containers can be started,
  # stopped and removed; images, volumes, networks and exec stay refused, and
  # the gateway never holds the Docker socket itself.
  docker:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  data:
