services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    # The panel answers on this computer alone. Every other device, at home or
    # away, reaches myTunnels through a tunnel, so no port opens on the network.
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - data:/data
      # The key that seals secrets in the database, kept apart from it so a
      # copy of the data volume does not carry them.
      - keys:/keys
    environment:
      DOCKER_HOST: tcp://docker:2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker

  # The Dashboard, Containers and Images pages' view of Docker. Only the calls
  # the panel makes are allowed, by method and path: listing, inspecting, logs
  # and stats; start, stop, restart, pause, resume and kill; removing a
  # container; and listing, inspecting and removing images by ID. Creating
  # containers, exec, pulling or building images, volumes and networks are
  # refused, and only the gateway may connect. The gateway never holds the
  # Docker socket itself.
  docker:
    image: wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    restart: unless-stopped
    # Root only to open the socket; every capability is dropped.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    command:
      - '-listenip=0.0.0.0'
      - '-allowfrom=gateway'
      - '-allowGET=(/v[0-9.]+)?/(_ping|info|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs|stats)|images/json|images/sha256:[a-f0-9]{64}/(json|history))'
      - '-allowPOST=(/v[0-9.]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(start|stop|restart|pause|unpause|kill)'
      - '-allowDELETE=(/v[0-9.]+)?/(containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*|images/sha256:[a-f0-9]{64})'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  data:
  keys:
