<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f0f4f9, #131314); --card: light-dark(#ffffff, #1e1f20);
  --text: light-dark(#1f1f1f, #e3e3e3); --muted: light-dark(#444746, #c4c7c5); --faint: light-dark(#747775, #8e918f);
  --line: light-dark(#c4c7c5, #5e5e5e); --accent: light-dark(#0b57d0, #a8c7fa); --on-accent: light-dark(#ffffff, #062e6f);
  --ok: light-dark(#188038, #81c995); --warn: light-dark(#b06000, #fdd663); --bad: light-dark(#d93025, #f28b82);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--text);
  font: 14px/1.5 "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
}
main { width: 100%; max-width: 440px; padding: 36px 40px 32px; background: var(--card); border-radius: 28px; }
.host { margin-bottom: 20px; color: var(--faint); font: 13px ui-monospace, Consolas, monospace; }
h1 { margin: 0 0 6px; font-size: 24px; font-weight: 400; }
p { margin: 0; color: var(--muted); }
form, #device { margin-top: 28px; }
.tf { position: relative; margin-bottom: 16px; }
.tf input {
  width: 100%; height: 56px; padding: 0 16px; border: 0; border-radius: 4px; background: transparent; color: var(--text);
  font-size: 16px; font-family: inherit; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .15s;
}
.tf input:hover { box-shadow: inset 0 0 0 1px var(--text); }
.tf input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.tf label {
  position: absolute; left: 12px; top: 28px; padding: 0 4px; transform: translateY(-50%); background: var(--card);
  color: var(--muted); font-size: 16px; pointer-events: none; transition: top .15s, font-size .15s, color .15s;
}
.tf input:focus + label, .tf input:not(:placeholder-shown) + label { top: 0; font-size: 12px; }
.tf input:focus + label { color: var(--accent); }
.row { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 8px; }
button {
  height: 40px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent);
  font-weight: 500; font-size: 14px; font-family: inherit; cursor: pointer;
}
button:disabled { opacity: .5; cursor: default; }
button.text { padding: 0 12px; background: transparent; color: var(--accent); }
.error { min-height: 20px; margin: 4px 0 0; color: var(--bad); font-size: 13px; }
.label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.id-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
#id { font: 500 28px/1.2 ui-monospace, Consolas, monospace; letter-spacing: .05em; }
.state { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.state[data-tone="ok"] .dot { background: var(--ok); }
.state[data-tone="bad"] .dot { background: var(--bad); }
.state[data-tone="warn"] .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.providers { display: grid; gap: 10px; margin-top: 28px; }
.provider {
  display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 999px;
  box-shadow: inset 0 0 0 1px var(--line); color: var(--text); font-weight: 500; text-decoration: none;
}
.provider:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.or { display: flex; align-items: center; gap: 12px; margin-top: 24px; color: var(--faint); font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.or + form { margin-top: 20px; }
.others { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.others a { color: var(--accent); text-decoration: none; margin-right: 16px; }
.others a:hover { text-decoration: underline; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-mode="{{MODE}}" data-others="{{OTHERS}}" data-data="{{DATA}}">
<main>
  <div class="host">{{HOST}}</div>
  <h1>{{TITLE}}</h1>
  <p>{{TEXT}}</p>

  <form id="password" hidden>
    <div class="tf"><input id="pw" type="password" placeholder=" " autocomplete="current-password" required><label for="pw">Password</label></div>
    <div class="error" id="password-error" role="alert"></div>
    <div class="row"><button type="submit">Continue</button></div>
  </form>

  <div class="providers" id="providers" hidden></div>
  <div class="or" id="or" hidden>or</div>
  <form id="login" hidden>
    <div class="tf"><input id="user" type="email" placeholder=" " autocomplete="email" autocapitalize="off" spellcheck="false" required><label for="user">Email</label></div>
    <div class="tf"><input id="secret" type="password" placeholder=" " autocomplete="current-password" required><label for="secret">Password</label></div>
    <div class="error" id="login-error" role="alert"></div>
    <div class="row"><button type="submit">Sign in</button></div>
  </form>

  <form id="code" hidden>
    <div class="tf"><input id="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder=" " autocomplete="one-time-code" required><label for="otp">6-digit code</label></div>
    <div class="error" id="code-error" role="alert"></div>
    <div class="row"><button type="submit">Verify</button></div>
  </form>

  <form id="logout" hidden>
    <div class="error" id="logout-error" role="alert"></div>
    <div class="row"><button type="submit">Sign out</button></div>
  </form>

  <div id="device" hidden>
    <div class="label">Device ID</div>
    <div class="id-row"><span id="id">....-....</span><button id="copy" class="text" type="button">Copy</button></div>
    <div class="state" id="state" data-tone="warn"><span class="dot"></span><span id="state-text">Checking this device</span></div>
  </div>

  <div class="others" id="others" hidden>Or <span id="other-links"></span></div>
</main>
<script>
(function () {
  var body = document.body, mode = body.dataset.mode, data = {};
  try { data = JSON.parse(body.dataset.data || '{}'); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var LABELS = { login: 'sign in with an account', password: 'use the tunnel password', device: 'use an approved device' };

  // Where to land once through: this page without the choice of method.
  function back() {
    var params = new URLSearchParams(location.search);
    params.delete('__gate');
    var q = params.toString();
    location.replace(location.pathname + (q ? '?' + q : '') + location.hash);
  }

  function post(path, data) {
    return fetch(path, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' }, body: JSON.stringify(data)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) { b.ok = b.ok || r.ok; return b; });
    });
  }

  function form(id, build) {
    var el = $(id), error = $(id + '-error'), button = el.querySelector('button');
    el.hidden = false;
    el.querySelector('input').focus();
    el.addEventListener('submit', function (e) {
      e.preventDefault();
      button.disabled = true;
      error.textContent = '';
      post('/__gate/' + id, build()).then(function (r) {
        if (r.code_required) return askCode(r.ticket, r.sent_to);
        if (r.ok) return data.path ? location.replace(data.path) : back();
        error.textContent = r.error || 'That did not work. Try again.';
        button.disabled = false;
      }).catch(function () {
        error.textContent = 'Could not reach the gateway. Try again.';
        button.disabled = false;
      });
    });
  }

  // After the password, a code sent to the account's email.
  function askCode(ticket, sentTo) {
    ['login', 'providers', 'or', 'others'].forEach(function (id) { $(id).hidden = true; });
    document.title = 'Check your email';
    document.querySelector('h1').textContent = 'Check your email';
    document.querySelector('main > p').textContent = 'Enter the code sent to ' + sentTo + '.';
    form('code', function () { return { ticket: ticket, code: $('otp').value.trim() }; });
  }

  var others = (body.dataset.others || '').split(' ').filter(Boolean);
  if (others.length) {
    $('others').hidden = false;
    $('other-links').innerHTML = others.map(function (kind) {
      var params = new URLSearchParams(location.search);
      params.set('__gate', kind);
      return '<a href="?' + params.toString() + '">' + LABELS[kind] + '</a>';
    }).join('');
  }

  if (mode === 'password') form('password', function () { return { password: $('pw').value }; });
  if (mode === 'login') {
    // Sign-in through another service comes back here once it is done.
    var providers = data.providers || [];
    if (providers.length) {
      var params = new URLSearchParams(location.search);
      params.delete('__gate');
      var q = params.toString(), here = location.pathname + (q ? '?' + q : '');
      providers.forEach(function (p) {
        var a = document.createElement('a');
        a.className = 'provider';
        a.href = '/__gate/oauth?p=' + encodeURIComponent(p.id) + '&r=' + encodeURIComponent(here);
        a.textContent = 'Continue with ' + p.name;
        $('providers').appendChild(a);
      });
      $('providers').hidden = false;
      $('or').hidden = false;
    }
    form('login', function () { return { email: $('user').value, password: $('secret').value }; });
  }
  if (mode === 'logout') {
    $('logout').hidden = false;
    $('logout').addEventListener('submit', function (e) {
      e.preventDefault();
      post('/__gate/logout', {}).then(function () { location.replace('/'); }).catch(function () {
        $('logout-error').textContent = 'Could not reach the gateway. Try again.';
      });
    });
  }
  if (mode === 'code') form('code', function () { return { ticket: data.ticket, code: $('otp').value.trim() }; });
  if (mode !== 'device') return;

  $('device').hidden = false;
  var fullId = '';
  function gpu() {
    try {
      var gl = document.createElement('canvas').getContext('webgl');
      if (!gl) return {};
      var ext = gl.getExtension('WEBGL_debug_renderer_info');
      return {
        vendor: gl.getParameter(ext ? ext.UNMASKED_VENDOR_WEBGL : gl.VENDOR),
        renderer: gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER)
      };
    } catch (e) { return {}; }
  }
  function info() {
    var n = navigator, ua = n.userAgentData, g = gpu();
    return {
      userAgent: n.userAgent,
      platform: (ua && ua.platform) || n.platform || '',
      mobile: ua ? !!ua.mobile : null,
      languages: n.languages ? Array.prototype.slice.call(n.languages) : [n.language],
      hardwareConcurrency: n.hardwareConcurrency || null,
      deviceMemory: n.deviceMemory || null,
      maxTouchPoints: n.maxTouchPoints || 0,
      screen: { width: screen.width, height: screen.height, colorDepth: screen.colorDepth, pixelRatio: window.devicePixelRatio },
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      webglVendor: g.vendor || '',
      webglRenderer: g.renderer || ''
    };
  }
  function show(s) {
    var text = 'Waiting for approval', tone = 'warn';
    if (s.allowed) { text = 'Approved, opening'; tone = 'ok'; }
    else if (s.status === 'approved') { text = 'Approved, but not for this app'; tone = 'bad'; }
    else if (s.status === 'denied') { text = 'Access denied'; tone = 'bad'; }
    else if (s.note) { text = s.note + ', waiting for review'; }
    fullId = s.id;
    $('id').textContent = s.id.length > 12 ? s.id.slice(0, 8) + '...' : s.id;
    $('state-text').textContent = text;
    $('state').dataset.tone = tone;
  }
  function check() {
    post('/__gate/enroll', { info: info() }).then(function (s) {
      if (!s.id) throw new Error(s.error || 'unavailable');
      show(s);
      if (s.allowed) return back();
      if (s.status !== 'denied') setTimeout(check, 5000);
    }).catch(function (e) {
      $('state-text').textContent = 'Could not reach the gateway (' + e.message + '), retrying';
      setTimeout(check, 10000);
    });
  }
  $('copy').addEventListener('click', function () {
    if (navigator.clipboard) navigator.clipboard.writeText(fullId);
  });
  check();
})();
</script>
</body>
</html>
