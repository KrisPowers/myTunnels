name: Release

# Every change to main that touches the app is built for each system and
# published as a release, which the install scripts and the Homebrew formula
# fetch. A pull request builds the same, without publishing.

on:
  push:
    branches: [main]
    paths: [server/**, ui/**, .github/workflows/release.yml]
  pull_request:
    paths: [server/**, ui/**, .github/workflows/release.yml]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: ui
          path: ui/dist

  build:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, cloudflared: cloudflared-linux-amd64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, cloudflared: cloudflared-linux-arm64 }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, cloudflared: cloudflared-darwin-arm64.tgz }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, cloudflared: cloudflared-darwin-amd64.tgz }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, cloudflared: cloudflared-windows-amd64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # musl builds are static, so one binary runs on every Linux.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - working-directory: server
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: stage/ui
      - name: Package
        run: |
          exe=""
          [ "${{ runner.os }}" = Windows ] && exe=.exe
          cp "server/target/${{ matrix.target }}/release/server$exe" "stage/mytunnels$exe"
          url="https://github.com/cloudflare/cloudflared/releases/latest/download/${{ matrix.cloudflared }}"
          case "${{ matrix.cloudflared }}" in
            *.tgz) curl -fsSL "$url" | tar -xz -C stage ;;
            *) curl -fsSL -o "stage/cloudflared$exe" "$url" ;;
          esac
          chmod +x "stage/mytunnels$exe" "stage/cloudflared$exe"
          cd stage
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "../${{ matrix.name }}.zip" . > /dev/null
          else
            tar -czf "../${{ matrix.name }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-*"
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The next after the latest release, as scripts/build.ps1 numbers them.
          latest=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          latest=${latest#v}
          VERSION=$([ -n "$latest" ] && echo "${latest%.*}.$(( ${latest##*.} + 1 ))" || echo 0.1.0)
          gh release create "v$VERSION" dist/* --title "$VERSION" --notes "Built from ${GITHUB_SHA::7}." --target "$GITHUB_SHA"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Formula
        run: |
          # Each url line names the release and archive, with its sha256 under it.
          f=Formula/mytunnels.rb
          for n in macos-arm64 macos-x64 linux-arm64 linux-x64; do
            sum=$(sha256sum "dist/$n.tar.gz" | cut -d' ' -f1)
            sed -i -E "/\/$n\.tar\.gz\"/{s|/download/v[^/]+/|/download/v$VERSION/|;n;s|sha256 \"[^\"]*\"|sha256 \"$sum\"|}" "$f"
          done
          sed -i -E "s|^  version \"[^\"]*\"|  version \"$VERSION\"|" "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mytunnels.rb
          git commit -m "chore(brew): point the formula at $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
